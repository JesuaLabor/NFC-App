<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0088CC" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E96A" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="8 8" />

  <!-- Concentric NFC Wave Arcs -->
  <!-- Wave 3 -->
  <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.3" filter="url(#glow)" />
  <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Wave 2 -->
  <path d="M 158 214 A 130 130 0 0 1 354 214" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linecap="round" stroke-opacity="0.6" filter="url(#glow)" />
  <path d="M 158 214 A 130 130 0 0 1 354 214" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Wave 1 -->
  <path d="M 196 250 A 80 80 0 0 1 316 250" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 196 250 A 80 80 0 0 1 316 250" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

  <!-- Center NFC Chip Node -->
  <circle cx="256" cy="306" r="28" fill="#00D4FF" filter="url(#glow)" />
  <circle cx="256" cy="306" r="24" fill="#00E96A" />
  <circle cx="256" cy="306" r="12" fill="#FFFFFF" />

  <!-- Circuit traces -->
  <path d="M 256 334 L 256 390 M 230 380 L 256 406 L 282 380" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="406" r="6" fill="#00D4FF" />
</svg>
