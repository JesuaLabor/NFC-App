name: Build iOS IPA (For Sideloading)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nfc-programmer/package-lock.json

      - name: Install dependencies
        working-directory: ./nfc-programmer
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS)
        working-directory: ./nfc-programmer
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        working-directory: ./nfc-programmer/ios
        run: pod install

      - name: Build unsigned iOS App
        working-directory: ./nfc-programmer/ios
        run: |
          xcodebuild clean build \
            -workspace NFCProgrammer.xcworkspace \
            -scheme NFCProgrammer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        working-directory: ./nfc-programmer/ios
        run: |
          mkdir -p Payload
          cp -R derived_data/Build/Products/Release-iphoneos/NFCProgrammer.app Payload/
          zip -qr NFCProgrammer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-programmer-ios-ipa
          path: nfc-programmer/ios/NFCProgrammer.ipa
          retention-days: 14
